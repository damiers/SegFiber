experiment:
  name: SegFiberBrainZSlabs
  output_dir: out
  seed: 31

runtime:
  name: standalone
  params:
    devices: [0]

dataset:
  infer:
    name: brain_z_slabs
    params:
      image_path:
      roi:
      patch_size: 300
      slab_thickness: 300
      level: 0
      channel: 0

arch:
  name: unet
  params:
    in_channels: 1
    out_channels: 1
    features: [32, 64, 128]
    norm_type: batch

inference:
  name: brain_z_slabs
  params:
    checkpoint: universal_tiny.pth
    output_path: out/brain_z_slabs
    output_prefix: SegFiber_
    background_threshold: 150
    tile_batch_size: 8
    keep_branch: false
    workers: 0
