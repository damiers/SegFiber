# background threshold
bg_thres: 300
# resolution level
level: 0
# channel number, 0 means 488
channel: 0
# cube size accepted by the segmentation model
chunk_size: 300
# thickness of one brain slice
splice: 300

# ROI you wanna segment, 'null' means the entire volume to be processed
# format: [x_start, y_start, z_start, x_size, y_size, z_size]
# roi: [0,0,0,128,128,128]
roi: null

# where your image data
input_path: 'test/data/test.tif'
# input_path: '/share/data/VISoR_Reconstruction/SIAT_SIAT/XuFang/Mouse_Brain/20250302_YY_SEED_TTA-1E9-28D_2608_1/Recon_wholebrain_1um/TTA2608_1um_WholeBrain.ims'

# where your result data to be saved
# to mysql. If you want to save the result to mysql, set the mysql to true
mysql: false
# db_name: 'segerTest'
# db_url: 'localhost:3306'
# db_username: 'root'
# db_password: 'neurodb'

# to sqlite file
output_path: 'test/out/test.db'
